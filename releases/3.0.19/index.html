<script>
(()=>{'use strict';

function ico(name,size=17){return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[name]||icons.info}</svg>`}
document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=ico(e.dataset.i,e.closest('.mobilebar')?20:17)});document.getElementById('brand-mark').innerHTML=`<svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M7 17H17M12 12V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const zones=[{id:'studio',name:'產品設計',color:'#a5c8a8'},{id:'research',name:'研究探索',color:'#d5b38b'},{id:'operations',name:'系統維運',color:'#92b8af'}];const stages=['規劃','執行','驗證','交付'];const key='agent-workspace-v3-20261008';
function fresh(){return {tasks:[{id:'t1',name:'設計下一代工作空間',desc:'整理多代理工作模型，確認任務切換與決策流程。優先處理清楚的資訊層級與操作回饋。',zone:'studio',step:1,paused:false,approved:false,revision:0},{id:'t2',name:'彙整探索資料與方向',desc:'將研究紀錄收束成可追蹤的執行項目，等待最後一輪審核。',zone:'research',step:3,paused:false,approved:false,revision:0},{id:'t3',name:'驗證自動化守護流程',desc:'確認狀態寫入、監測週期與異常回復的預期行為。',zone:'operations',step:2,paused:true,approved:false,revision:0}],selected:'t1',logs:[{at:Date.now()-1000*60*14,text:'設計下一代工作空間 · 進入執行階段',task:'t1'},{at:Date.now()-1000*60*27,text:'彙整探索資料與方向 · 等待審核',task:'t2'},{at:Date.now()-1000*60*45,text:'驗證自動化守護流程 · 已暫停',task:'t3'}]}}
function load(){try{let o=JSON.parse(localStorage.getItem(key));if(o&&Array.isArray(o.tasks)&&o.tasks.length&&Array.isArray(o.logs))return o}catch(e){}return fresh()};let state=load(),page='home',zone='all',mobileDetail=false,plannerOpen=false;const $=id=>document.getElementById(id);const selected=()=>state.tasks.find(t=>t.id===state.selected)||state.tasks[0];const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const zoneName=id=>zones.find(z=>z.id===id)?.name||'Workspace';const progress=t=>t.approved?100:[10,38,72,92][t.step]??0;const pending=t=>t.step===3&&!t.approved;const status=t=>t.approved?'已交付':t.paused?'已暫停':pending(t)?'等待審核':['規劃中','執行中','驗證中','待交付'][t.step]||'進行中';const statusClass=t=>t.approved?'done':t.paused?'paused':pending(t)?'pending':'running';const time=t=>new Date(t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function log(text,task){state.logs.unshift({at:Date.now(),text,task});state.logs=state.logs.slice(0,70)}
let toastTimer;function toast(msg){$('toast-container').innerHTML=`<div class="toast">${ico('check',16)}<span>${safe(msg)}</span></div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast-container').innerHTML='',2600)}
function go(next){page=next;mobileDetail=false;render();window.scrollTo({top:0,behavior:'instant'})}function setDetail(on){mobileDetail=on;document.body.dataset.mobileDetail=on?'true':'false';if(on&&window.innerWidth<=690)window.scrollTo({top:0,behavior:'instant'})}
function metrics(){let active=state.tasks.filter(t=>!t.paused&&!t.approved&&!pending(t)).length,p=state.tasks.filter(pending).length,done=state.tasks.filter(t=>t.approved).length;return `<div class="metrics"><div class="metric"><div class="num">${String(active).padStart(2,'0')}</div><div class="name">執行中的任務</div></div><div class="metric"><div class="num">${String(p).padStart(2,'0')}${p?'<span class="hint">需要決策</span>':''}</div><div class="name">等待你審核</div></div><div class="metric"><div class="num">${String(done).padStart(2,'0')}</div><div class="name">已完成交付</div></div></div>`}
function list(){const tasks=state.tasks.filter(t=>zone==='all'||t.zone===zone);return `<section class="panel tasklist"><div class="panel-head"><h2>你的工作</h2><small>${tasks.length} 項</small></div><div class="task-stack">${tasks.map(t=>`<button class="taskrow ${t.id===state.selected?'active':''}" data-task="${safe(t.id)}" aria-pressed="${t.id===state.selected}"><div class="taskrow-top"><span class="statusdot ${statusClass(t)}"></span><span class="task-name">${safe(t.name)}</span>${ico('chevron',15)}</div><div class="task-meta"><span>${safe(zoneName(t.zone))}</span><span>${status(t)}</span></div><div class="tiny-progress"><b style="width:${progress(t)}%"></b></div></button>`).join('')||'<div class="empty">這個空間目前沒有任務。</div>'}</div><div class="list-footer"><span>任務會在此持續更新</span><span class="list-foot-spark">✦</span></div></section>`}
function detail(){const t=selected();if(!t)return '';const step=t.step;
const waiting=pending(t);
const stageTitle=t.approved?'已完成交付':t.paused?'工作已暫停':waiting?'現在輪到你':(['正在釐清方向','正在展開工作','正在仔細驗證'][step]);
const stageDesc=t.approved?'結果已保存，你可以隨時查看紀錄。':t.paused?'目前停止推進，所有脈絡都已保留。':waiting?'驗證工作已完成。請決定是否交付這項成果。':(['Planner 正在整理範圍、依賴關係和下一個行動。','Executor 正在執行目前的工作階段。','Verifier 正在獨立檢查產出的結果。'][step]);
const action=t.approved?`<button class="secondary" data-act="planner">${ico('message',16)}檢視對話</button>`:waiting?`<button class="primary" data-act="approve">${ico('check',17)}核准交付</button><button class="secondary" data-act="revise">退回修正</button>`:`<button class="primary" data-act="${t.paused?'resume':'advance'}">${ico(t.paused?'play':'arrow',17)}${t.paused?'繼續工作':'推進示範流程'}</button><button class="secondary" data-act="${t.paused?'resume':'pause'}">${ico(t.paused?'play':'pause',16)}${t.paused?'恢復':'暫停'}</button>`;
const roles=[
 {name:'Planner',zh:'規劃',initial:'✳',tag:'定義問題與安排路徑',detail:'工作範圍、上下文與下一步',done:step>0||t.approved,live:step===0&&!t.paused&&!t.approved},
 {name:'Executor',zh:'執行',initial:'◈',tag:'把計畫轉為實際工作',detail:'執行進度與產出狀態',done:step>1||t.approved,live:step===1&&!t.paused&&!t.approved},
 {name:'Verifier',zh:'驗證',initial:'✓',tag:'獨立檢查交付品質',detail:'驗證意見與審核準備',done:step>=3||t.approved,live:step===2&&!t.paused&&!t.approved}
];
const logs=state.logs.filter(l=>l.task===t.id).slice(0,3);
return `<section class="detail" aria-label="目前任務詳情"><div class="detail-top"><div class="context">${safe(zoneName(t.zone))} <span class="context-slash">·</span> 任務詳情</div><div class="chip ${statusClass(t)}"><span class="statusdot ${statusClass(t)}"></span>${status(t)}</div></div>
<div class="work-heading"><h2>${safe(t.name)}</h2><p class="detail-desc">${safe(t.desc)}</p></div>
<div class="focus-surface ${waiting?'needs-you':''} ${t.approved?'is-done':''}" aria-label="即時工作狀態"><div class="focus-halo" aria-hidden="true"><div class="halo-one"></div><div class="halo-two"></div></div><div class="focus-top"><span class="focus-kicker"><span class="focus-led"></span>${waiting?'等待回覆':t.paused?'暫停中':t.approved?'已完成':'正在進行'}</span><span class="focus-counter">${String(t.approved?4:step+1).padStart(2,'0')} <span>／</span> 04</span></div><div class="focus-statement" aria-live="polite"><h3>${stageTitle}</h3><p>${stageDesc}</p></div><div class="focus-meter" role="progressbar" aria-valuenow="${progress(t)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${progress(t)}%"></span></div><div class="focus-bottom"><span>本地互動示範 · 非真實代理</span><strong>${progress(t)}%</strong></div></div>
<div class="section-heading"><h3>工作接力</h3><span>每一個階段都有明確的責任</span></div>
<div class="people-rail">${roles.map((r,i)=>`<div class="person ${r.live?'is-live':''} ${r.done?'is-complete':''}"><div class="person-avatar avatar-${i}"><span>${r.initial}</span></div><div class="person-copy"><div class="person-line"><strong>${r.name}</strong><small>${r.zh}</small></div><p>${r.live?r.tag:r.done?'這一階段已完成':r.detail}</p></div><div class="person-state">${r.live?'<span class="work-pulse"></span>處理中':r.done?'已完成':t.paused?'暫停':'待命'}</div></div>`).join('')}</div>
<div class="floating-action"><div class="action-text"><span class="action-overline">${waiting?'等待你的決定':t.approved?'工作已結束':'目前可執行'}</span><strong>${waiting?'檢查成果，然後決定':t.approved?'查看這次工作的脈絡':t.paused?'你可以從這裡繼續':'讓工作繼續向前'}</strong></div><div class="action-buttons">${action}</div><button class="iconbtn action-chat" data-act="planner" title="與 Planner 對話" aria-label="與 Planner 對話">${ico('message',19)}</button></div>
<div class="event-line"><div class="topline"><h3>最近發生</h3><button class="quietbtn" data-page="activity">完整紀錄 ${ico('arrow',13)}</button></div>${logs.length?logs.map(l=>`<div class="logrow"><time>${time(l.at)}</time><span>${safe(l.text)}</span></div>`).join(''):'<p class="empty-note">這項任務目前沒有操作紀錄</p>'}</div></section>`}
function home(){let a=state.tasks.filter(t=>!t.paused&&!t.approved&&!pending(t)).length,p=state.tasks.filter(pending).length;return `<div class="headline"><div><div class="eyebrow"><span class="eyebrow-glow"></span> 你的工作空間</div><h1 class="page-title">讓工作，<em>自然發生。</em></h1><p class="page-sub">不用時刻盯著進度。重要的變化，會出現在眼前。</p></div><div class="head-tools"><span class="head-orb"></span>${a} 項進行中${p?' <span class="head-sep">·</span> '+p+' 項待審核':''}</div></div><div class="split">${list()}${detail()}</div><footer class="footnote">工作空間 3.0.19　·　僅為本機互動原型，沒有連接真實代理。</footer>`}
function inbox(){let items=state.tasks.filter(pending);return `<div class="eyebrow">需要你處理</div><h1 class="page-title">等待你決定</h1><p class="page-sub inbox-intro">只有真正需要決策的任務才會出現在這裡。不需要反覆查看所有代理。</p><div class="inbox-list">${items.length?items.map(t=>`<div class="inboxrow"><div class="inboxbody"><div class="context">${safe(zoneName(t.zone))} · 等待審核</div><h3>${safe(t.name)}</h3><p>驗證階段已完成，請確認是否核准交付，或將任務退回執行。</p></div><div class="inbox-actions"><button class="secondary" data-review="${safe(t.id)}" data-choice="revise">要求修正</button><button class="primary" data-review="${safe(t.id)}" data-choice="approve">${ico('check',15)}核准</button></div></div>`).join(''):'<div class="empty" style="padding:58px 22px">目前沒有需要審核的任務。<br>當任務完成驗證，會自動出現在這裡。</div>'}</div>`}
function activity(){return `<div class="eyebrow">工作紀錄</div><h1 class="page-title">活動紀錄</h1><p class="page-sub">所有狀態變更依時間排列，不必從動畫推測發生了什麼。</p><div class="timeline">${state.logs.map(l=>`<div class="event"><time>${time(l.at)}</time><span class="marker"></span><div><strong>${safe(l.text)}</strong><p>${new Date(l.at).toLocaleDateString('zh-TW')} · 本機操作紀錄</p></div></div>`).join('')}</div>`}
function settings(){return `<div class="eyebrow">工作空間</div><h1 class="page-title">設定與說明</h1><p class="page-sub">知道這個介面能做什麼，也知道它還不能做什麼。</p><div class="settingscard"><h2>原型狀態</h2><p>這是純前端操作概念，模擬一個遠端多代理工作台的狀態與控制。可以建立任務、推進流程、執行審核並與 Planner 進行本地情境對話，但沒有連接真實電腦、付費 API 或任何模型。所有資料僅存於目前瀏覽器的 localStorage。</p><div class="settingsrow"><div><div class="settinglabel">清除所有示範資料</div><small>恢復預設的三項任務和操作紀錄。</small></div><button class="secondary danger" data-act="reset">重設原型</button></div></div>`}
function render(){if(!state.tasks.find(t=>t.id===state.selected))state.selected=state.tasks[0]?.id;save();$('content').innerHTML=page==='home'?home():page==='inbox'?inbox():page==='activity'?activity():settings();$('crumb-title').textContent={home:'總覽',inbox:'待處理',activity:'活動紀錄',settings:'設定與說明'}[page];document.querySelectorAll('[data-page].navitem,.mobilebar button[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page)});const p=state.tasks.filter(pending).length;$('side-count').textContent=p;$('side-count').hidden=!p;$('mobile-count').textContent=p;$('mobile-count').hidden=!p;const n=state.tasks.filter(t=>zone==='all'||t.zone===zone).length;$('zone-nav').innerHTML=`<button class="navitem zonebtn ${zone==='all'?'active':''}" data-zone="all"><span class="dot" style="--dot:#9ba4af"></span><span>所有空間</span><span style="margin-left:auto;font-size:10px;color:#9299a0">${state.tasks.length}</span></button>`+zones.map(z=>`<button class="navitem zonebtn ${zone===z.id?'active':''}" data-zone="${z.id}"><span class="dot" style="--dot:${z.color}"></span><span>${z.name}</span><span style="margin-left:auto;font-size:10px;color:#9299a0">${state.tasks.filter(t=>t.zone===z.id).length}</span></button>`).join('');document.body.dataset.mobileDetail=mobileDetail&&page==='home'?'true':'false'}
