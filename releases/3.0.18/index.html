<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b1c5e7"><meta name="app-version" content="3.0.18"><title>Liquid Glass — Material Study</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang TC',sans-serif;color:#26344d}*{box-sizing:border-box}body{margin:0;background:#b9c7df}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.app{height:100dvh;min-height:580px;overflow:hidden;isolation:isolate;position:relative;background:linear-gradient(133deg,#cdd8ee 1%,#b6b5e0 38%,#eac3c6 71%,#f9dfb2);transition:background .6s}.orb{position:absolute;border-radius:50%;pointer-events:none;transition:transform .9s cubic-bezier(.2,.8,.2,1)}.orb.a{width:75vmax;height:75vmax;left:-22vmax;top:9%;background:radial-gradient(circle at 30% 26%,#dcf1ed,#8eaddb 35%,#7188c8 61%,#bab1d7);box-shadow:inset -45px -55px 85px #6f81b547,35px 25px 95px #6c7ab64d}.orb.b{width:68vmax;height:68vmax;right:-23vmax;top:-42%;background:radial-gradient(circle at 28% 72%,#fde8c3,#f2a999 44%,#d98eb3 76%,#a394c9);box-shadow:inset 20px 30px 90px #fff6,0 20px 95px #a96e9a36}.orb.c{width:36vmax;height:36vmax;bottom:-27%;left:39%;filter:blur(8px);background:radial-gradient(circle at 25% 20%,#f4e6c2,#c4b2d4,#91aedc)}.app[data-scene="2"]{background:linear-gradient(135deg,#677b91,#9a93a9,#d0a99e)}.app[data-scene="2"] .orb.a{transform:translate(32%,10%) scale(1.13)}.app[data-scene="2"] .orb.b{transform:translate(-25%,45%) scale(.9)}.app[data-scene="3"]{background:linear-gradient(135deg,#a0c9be,#d9e6d3,#d7d2a1)}.app[data-scene="3"] .orb.a{transform:translate(-12%,15%) scale(.83)}.app[data-scene="3"] .orb.b{transform:translate(-28%,-8%) scale(1.09)}.grain{position:absolute;inset:0;pointer-events:none;opacity:.19;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E")}.glass{position:relative;isolation:isolate;border:1px solid #ffffffa6;background:linear-gradient(150deg,#ffffff77,#ffffff22 52%,#ffffff5c);box-shadow:inset 0 1px 1px #fff,inset 0 -1px 2px #ffffff70,0 12px 35px #31476427,0 2px 5px #ffffff77;-webkit-backdrop-filter:blur(27px) saturate(1.7);backdrop-filter:blur(27px) saturate(1.7);color:#24354b}.glass:before{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;box-shadow:inset 1px 2px 2px #fffc,inset -2px -3px 6px #3c567019}.ui{position:relative;height:100%;z-index:3;padding:clamp(20px,3vw,42px);display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.label{font-size:11px;letter-spacing:2.4px;font-weight:750;color:#263b58b8}.label small{display:block;margin-top:7px;font-size:11px;letter-spacing:0;font-weight:500}.actions{display:flex;gap:10px}.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:transform .35s cubic-bezier(.2,1.7,.3,1),background .2s}.round:active{transform:scale(.86);background:#ffffffb3}.round svg,.dock svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:115px}.eyebrow{font-size:11px;letter-spacing:4px;font-weight:800;color:#30415eaf}.center h1{color:#fdfcff;text-shadow:0 5px 35px #4b64885c;font-size:clamp(50px,10vw,120px);line-height:1.04;letter-spacing:-.065em;margin:18px 0}.center p{color:#fffffff0;text-shadow:0 2px 12px #4058795f;font-size:clamp(12px,1.5vw,16px)}.hero{border-radius:100px;margin-top:28px;padding:18px 29px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:12px;transition:transform .36s cubic-bezier(.2,1.75,.3,1),background .3s,box-shadow .3s}.hero:active{transform:scale(.92,.87);background:#fff9}.hero.lit{background:#ffffffdb;box-shadow:0 0 0 13px #ffffff24,0 15px 42px #536a7d4e,inset 0 1px 2px #fff}.dockbar{position:absolute;bottom:max(25px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;justify-content:center;align-items:center;gap:12px}.dock{display:flex;padding:7px;border-radius:30px;gap:4px}.dock button{background:transparent;border:0;border-radius:24px;min-width:77px;padding:13px 15px;display:grid;justify-items:center;gap:5px;font-size:11px;font-weight:650;color:#2d4055;transition:transform .26s cubic-bezier(.2,1.7,.3,1),background .2s}.dock button:active{transform:scale(.87)}.dock button.active{background:linear-gradient(145deg,#fffffff2,#fffdf5ce);box-shadow:0 2px 11px #4b64713a,inset 0 1px 1px white}.pop{position:absolute;right:clamp(20px,3vw,42px);top:90px;width:min(310px,calc(100% - 40px));padding:17px;border-radius:26px;transform:translateY(-9px) scale(.91);transform-origin:top right;opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,1.35,.3,1),opacity .18s;z-index:5}.pop.open{transform:none;opacity:1;pointer-events:auto}.pop h2{font-size:17px;margin:5px 5px 9px}.pop p{font-size:12px;color:#52677d;margin:0 5px 14px}.choice{width:100%;border:0;text-align:left;padding:13px;border-radius:14px;background:#ffffff45;color:#2b4055;margin:4px 0;font-size:13px}.choice.active{background:#ffffffb8}.choice span{float:right}.toast{position:absolute;top:30px;left:50%;padding:11px 18px;border-radius:28px;font-size:12px;white-space:nowrap;transform:translate(-50%,-14px);opacity:0;pointer-events:none;transition:all .25s;z-index:7}.toast.show{opacity:1;transform:translate(-50%,0)}.shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,#ffffff5f,transparent 50%);opacity:0;transition:opacity .25s}.shine.on{opacity:1}.hint{position:absolute;bottom:122px;left:20px;right:20px;text-align:center;font-size:12px;color:#2d47638e}@media(max-width:600px){.app{min-height:560px}.orb.a{width:110vmax;height:110vmax;left:-68vmax;top:12%}.orb.b{width:95vmax;height:95vmax;right:-60vmax;top:-5%}.dock button{min-width:57px;padding:11px 8px;font-size:10px}.round{width:46px;height:46px}.center h1{font-size:clamp(46px,12vw,74px)}.eyebrow{font-size:9px}.hint{bottom:110px}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}
</style></head><body><main class="app" id="app" data-scene="1"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div class="grain"></div><div class="shine" id="shine"></div><div class="ui"><header class="top"><div class="label">MATERIAL STUDY<small>01 / Liquid Glass · Web Prototype</small></div><div class="actions"><button class="glass round" id="theme" aria-label="切換場景"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg></button><button class="glass round" id="menu" aria-label="設定" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button></div></header><section class="center"><span class="eyebrow">INTERFACE MATERIAL / 001</span><h1>Light, in motion.</h1><p>透明、柔和的光感，以及即時的觸控回饋。</p><button class="glass hero" id="hero"><span>✦</span><span id="hero-text">Touch the glass</span><span>↗</span></button></section><div class="hint" id="hint">點擊玻璃按鈕或底部工具列，測試互動</div><footer class="dockbar"><nav class="glass dock" aria-label="功能切換"><button class="active" data-tab="工作空間"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>工作空間</button><button data-tab="任務"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>任務</button><button data-tab="Agent"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 6a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 5v1"/></svg>Agent</button><button data-tab="收件匣"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 14h5l2 3h2l2-3h5"/></svg>收件匣</button></nav><button class="glass round" id="add" aria-label="新增"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></footer></div><section class="glass pop" id="popover"><h2>顯示設定</h2><p>切換背景，測試玻璃的透明與模糊效果。</p><button class="choice active" data-bg="1">晨光 <span>✓</span></button><button class="choice" data-bg="2">暮色 <span></span></button><button class="choice" data-bg="3">薄荷 <span></span></button></section><div class="glass toast" id="toast" role="status"></div></main><script>
(()=>{const app=document.getElementById('app'),pop=document.getElementById('popover'),menu=document.getElementById('menu'),hero=document.getElementById('hero');let scene=1,lit=false,handle;const toast=s=>{const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(handle);handle=setTimeout(()=>el.classList.remove('show'),1450)};const setScene=n=>{scene=n;app.dataset.scene=n;document.querySelectorAll('[data-bg]').forEach(b=>{const a=Number(b.dataset.bg)===n;b.classList.toggle('active',a);b.querySelector('span').textContent=a?'✓':''})};const showMenu=open=>{pop.classList.toggle('open',open);menu.setAttribute('aria-expanded',String(open))};menu.addEventListener('click',()=>showMenu(!pop.classList.contains('open')));document.getElementById('theme').addEventListener('click',()=>{setScene(scene%3+1);toast(['','晨光','暮色','薄荷'][scene])});document.querySelectorAll('[data-bg]').forEach(b=>b.addEventListener('click',()=>{setScene(+b.dataset.bg);showMenu(false)}));hero.addEventListener('click',()=>{lit=!lit;hero.classList.toggle('lit',lit);document.getElementById('shine').classList.toggle('on',lit);document.getElementById('hero-text').textContent=lit?'Glass activated':'Touch the glass';document.getElementById('hint').textContent=lit?'已啟用 · 再點一次還原':'點擊玻璃按鈕或底部工具列，測試互動'});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',b===x));toast('已選取 '+b.dataset.tab)}));document.getElementById('add').addEventListener('click',()=>toast('新增操作 · 示意'));document.addEventListener('keydown',e=>{if(e.key==='Escape')showMenu(false)})})();
</script></body></html>
